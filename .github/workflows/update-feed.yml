name: Update products from feed

on:
  schedule:
    # Обновляем каждый день в 6:00 UTC (9:00 МСК)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Позволяет запустить вручную

jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Разрешение на запись в репозиторий
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and parse feed
        run: python scripts/parse_feed.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/products.json
          git diff --staged --quiet || git commit -m "Update products from feed $(date '+%Y-%m-%d %H:%M')"
          git push
